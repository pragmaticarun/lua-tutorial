name: Test examples and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache interpreters
        id: cache-lua
        uses: actions/cache@v6
        with:
          path: |
            /opt/lua-5.5.1
            /opt/lua-5.4.9
            /opt/luajit-2.1
          key: lua-${{ runner.os }}-${{ hashFiles('scripts/install-interpreters.sh') }}

      - name: Build Lua 5.5, Lua 5.4 and LuaJIT 2.1
        if: steps.cache-lua.outputs.cache-hit != 'true'
        run: scripts/install-interpreters.sh

      - name: Link cached interpreters
        if: steps.cache-lua.outputs.cache-hit == 'true'
        run: |
          sudo ln -sf /opt/lua-5.5.1/bin/lua /usr/local/bin/lua5.5
          sudo ln -sf /opt/lua-5.4.9/bin/lua /usr/local/bin/lua5.4
          sudo ln -sf /opt/luajit-2.1/bin/luajit /usr/local/bin/luajit

      - name: System packages for the Part 4 hosts (virtual X server, Mesa, OpenSSL headers)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1 libegl1 libgl1-mesa-dri libssl-dev unzip

      - name: Cache Part 4 hosts (Neovim, Redis, OpenResty, mpv, LÖVE, LuaRocks, StyLua)
        uses: actions/cache@v6
        with:
          path: /opt/hosts
          key: hosts-${{ runner.os }}-${{ hashFiles('scripts/install-hosts.sh', 'scripts/hosts/mpv-env.lock', 'scripts/install-interpreters.sh') }}

      - name: Install pinned hosts (skips anything already in the cache)
        run: scripts/install-hosts.sh

      - name: Set up Rust (Lesson 22)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo registry and mlua builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            examples/22-mlua/target
            projects/p6-rust-pipeline/target
          key: cargo-${{ runner.os }}-${{ hashFiles('examples/22-mlua/Cargo.lock', 'projects/p6-rust-pipeline/Cargo.lock', 'scripts/install-interpreters.sh') }}

      - name: Toolchain versions
        run: |
          gcc --version | head -1
          g++ --version | head -1
          cmake --version | head -1
          rustc --version
          cargo --version
          nvim --version | head -1
          redis-server --version
          openresty -v
          mpv --version | head -1
          love --version
          luarocks --version | head -1
          busted --version
          luacheck --version | head -1
          stylua --version

      - name: Build and run every example (Lua, C, C++, Rust), every project and every host test
        run: tests/run_all.sh

      - name: Check committed test badges are up to date
        run: git diff --exit-code -- includes/badges

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs Material
        run: pip install -r requirements.txt

      - name: Build site (strict)
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
