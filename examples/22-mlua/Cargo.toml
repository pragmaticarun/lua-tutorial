[package]
name = "mlua-lessons"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lesson 22 examples: embedding Lua in Rust with mlua"

# Exactly one Lua version must be enabled. The test runner builds three times:
#   cargo build --release --no-default-features --features lua55   (and lua54, luajit)
# with LUA_LIB / LUA_LIB_NAME / LUA_LINK=static pointing at the course's own
# Lua builds. Add "vendored" to let mlua compile its own copy of Lua instead:
#   cargo run --release --features vendored --bin embed
[features]
default = ["lua55"]
lua55 = ["mlua/lua55"]
lua54 = ["mlua/lua54"]
luajit = ["mlua/luajit"]
vendored = ["mlua/vendored"]

[dependencies]
mlua = "=0.12.2"

[profile.release]
debug = false
