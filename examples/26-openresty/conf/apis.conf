location = /echo   { content_by_lua_block { require("apis").echo() } }
location = /counter { content_by_lua_block { require("apis").counter() } }
location = /re     { content_by_lua_block { require("apis").regex() } }
location = /status { content_by_lua_block { require("apis").status() } }
location = /sub    { content_by_lua_block { require("apis").subrequests() } }
location /internal/ {
    internal;      # reachable only through subrequests
    content_by_lua_block { ngx.say("internal ", ngx.var.uri, " args=", ngx.var.args or "") }
}
