# The API gateway (port __GW_PORT__) in front of two fake backends (__BACKEND_PORT__).
upstream backend {
    server 127.0.0.1:__BACKEND_PORT__;
    keepalive 16;
}

server {
    listen 127.0.0.1:__GW_PORT__;

    location /api/ {
        set $backend_path "";                       # filled in by access()
        access_by_lua_block { require("gateway").access() }
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Consumer $http_x_consumer;
        proxy_pass http://backend$backend_path$is_args$args;
        header_filter_by_lua_block { require("gateway").header_filter() }
        log_by_lua_block { require("gateway").log() }
    }
    location = /api/dashboard {
        access_by_lua_block { require("gateway").access() }
        content_by_lua_block { require("gateway").dashboard() }
        log_by_lua_block { require("gateway").log() }
    }
    location = /metrics { content_by_lua_block { require("gateway").metrics() } }
}

# Fake backend services, written in Lua too.
server {
    listen 127.0.0.1:__BACKEND_PORT__;
    location / { content_by_lua_block { require("backends").handle() } }
}
