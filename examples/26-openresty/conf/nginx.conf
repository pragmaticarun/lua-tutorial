# The whole lesson runs in one OpenResty instance (placeholders like
# __PORT__ are filled in by openresty.sh).
worker_processes 1;            # one worker: shared dicts are shared anyway,
error_log logs/error.log info; # but per-worker Lua state is easier to reason about
pid logs/nginx.pid;

events { worker_connections 256; }

http {
    access_log off;
    lua_package_path "__DIR__/lua/?.lua;;";   # ";;" = append the default path
    lua_shared_dict stats 1m;                 # shared by all workers
    lua_shared_dict apikeys 1m;
    lua_shared_dict metrics 1m;
    lua_shared_dict cache 1m;

    # runs once in the master, before workers fork: load config, warm caches
    init_by_lua_block {
        require("gateway").init({ redis_port = __REDIS_PORT__, backend_port = __BACKEND_PORT__,
                                 dir = "__DIR__" })
    }
    # runs in every worker after the fork: timers belong here
    init_worker_by_lua_block {
        ngx.shared.stats:set("workers_started", (ngx.shared.stats:get("workers_started") or 0) + 1)
    }

    server {
        listen 127.0.0.1:__PORT__;
        location = / { return 200 "ok\n"; }
        include phases.conf;
        include apis.conf;
        include cosockets.conf;
        include exercises.conf;
    }

    include gateway.conf;
}
