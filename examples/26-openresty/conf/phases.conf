# Every phase handler appends its name to ngx.ctx.trail (ngx.ctx is a
# per-request Lua table shared by all phases of one request).
location = /phases {
    # set_by_lua runs during the rewrite phase; it must be quick (no I/O)
    set_by_lua_block $greeting {
        return "hello " .. (ngx.var.arg_name or "anonymous")
    }
    rewrite_by_lua_block {
        ngx.ctx.trail = { "rewrite" }
        if ngx.var.arg_old then return ngx.redirect("/phases?name=redirected", 302) end
    }
    access_by_lua_block {
        table.insert(ngx.ctx.trail, "access")
        if ngx.var.arg_name == "mallory" then return ngx.exit(ngx.HTTP_FORBIDDEN) end
    }
    content_by_lua_block {
        table.insert(ngx.ctx.trail, "content")
        ngx.say(ngx.var.greeting)
        ngx.say("phases so far: ", table.concat(ngx.ctx.trail, " > "))
    }
    # header filter: can change headers, not the body
    header_filter_by_lua_block {
        table.insert(ngx.ctx.trail, "header_filter")
        ngx.header["X-Trail"] = table.concat(ngx.ctx.trail, ",")
        ngx.header.content_length = nil   -- body_filter will change the length
    }
    # body filter: called once per chunk; ngx.arg[1] = data, ngx.arg[2] = eof
    body_filter_by_lua_block {
        if ngx.arg[2] then
            table.insert(ngx.ctx.trail, "body_filter")
            ngx.arg[1] = (ngx.arg[1] or "") .. "body_filter saw eof\n"
        end
    }
    # log phase: after the response has been sent to the client
    log_by_lua_block {
        table.insert(ngx.ctx.trail, "log")
        ngx.shared.stats:set("last_trail", table.concat(ngx.ctx.trail, " > "))
    }
}
location = /phases/last {
    content_by_lua_block {
        ngx.say("last request: ", ngx.shared.stats:get("last_trail"))
        ngx.say("workers started: ", ngx.shared.stats:get("workers_started"))
    }
}
