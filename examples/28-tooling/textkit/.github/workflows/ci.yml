# CI for textkit: tests on every Lua version, plus lint and format checks.
name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.2", "5.3", "5.4", "5.5", "luajit-2.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install busted
      - run: luarocks make                 # build + install this rock
      - run: busted -o TAP

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck
      - run: luacheck .
      - run: luarocks lint textkit-*.rockspec

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0                   # pin: formatting changes between versions
          args: --check .
