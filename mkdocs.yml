site_name: "Learn Lua: From Foundations to Embedding"
site_description: A tested, hands-on Lua tutorial for systems developers. Every snippet runs on Lua 5.5, Lua 5.4 and LuaJIT 2.1.
site_author: Arunkumar Maniam Rajan
site_url: https://pragmaticarun.github.io/lua-tutorial/
repo_url: https://github.com/pragmaticarun/lua-tutorial
repo_name: pragmaticarun/lua-tutorial
edit_uri: edit/main/docs/
copyright: "© 2026 Arunkumar Maniam Rajan · every code sample is tested on Lua 5.5, Lua 5.4 and LuaJIT 2.1"

theme:
  name: material
  language: en
  icon:
    logo: material/moon-waning-crescent
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Setup: setup.md
  - "Part 1: Foundations":
      - part1/index.md
      - "1. Why Lua": part1/01-why-lua.md
      - "2. Syntax, Types and Values": part1/02-syntax-types.md
      - "3. Control Flow": part1/03-control-flow.md
      - "4. Tables I": part1/04-tables-1.md
      - "5. Tables II": part1/05-tables-2.md
      - "6. Strings": part1/06-strings.md
      - "7. Patterns": part1/07-patterns.md
      - "8. Functions": part1/08-functions.md
      - "9. Closures and Upvalues": part1/09-closures.md
  - "Part 2: The Lua Way":
      - part2/index.md
      - "10. Metatables and Metamethods": part2/10-metatables.md
      - "11. OOP with Prototypes": part2/11-oop.md
      - "12. Modules and require": part2/12-modules.md
      - "13. Error Handling": part2/13-errors.md
      - "14. Iterators and Coroutines": part2/14-coroutines.md
      - "15. Standard Library Tour": part2/15-stdlib.md
      - "16. Garbage Collection": part2/16-gc.md
      - "17. Performance": part2/17-performance.md
  - "Part 3: Systems Lua":
      - part3/index.md
      - "18. LuaJIT: The Trace Compiler": part3/18-luajit.md
      - "19. The LuaJIT FFI": part3/19-ffi.md
      - "20. C API I: Embedding": part3/20-capi-embed.md
      - "21. C API II: C Modules": part3/21-capi-modules.md
      - "22. Rust with mlua": part3/22-mlua.md
  - "Part 4: Real World": part4/index.md
  - Projects: projects/index.md
  - Version Differences: version-differences.md
  - Glossary: glossary.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
